<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tirame una Birra · Girá y Adiviná</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat+Brush&family=Outfit:wght@400;600;800&display=swap">
<style>
/* Escena fija de 1600x900 que se escala a la pantalla (celular acostado). Look único de bar: sin tema claro/oscuro. */
:root{
  /* paleta de Girá y Adiviná (index.html): noche, oro, magenta, agua, crema */
  --noche:#160B24; --madera:#241239; --madera-cl:#E5197C; --ambar:#F5B301; --crema:#F6EFE2; --verde:#1E9C8A; --rojo:#E5197C; --agua:#37D6C0; --sombra:#0009;
  --tiza:"Caveat Brush","Comic Sans MS",cursive;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif; --texto:"Outfit",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--noche);color:var(--crema);font-family:var(--texto);overflow:hidden;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#escena{position:fixed;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:#000;touch-action:none}
#escena img{position:absolute;pointer-events:none;-webkit-user-drag:none}
.capa{position:absolute;inset:0}
#clientes,#efectos,#deco{pointer-events:none}
.banqueta{position:absolute;top:462px;width:120px;height:66px;filter:drop-shadow(0 4px 4px #000a)}
.banqueta::before{content:"";position:absolute;left:0;right:0;top:0;height:26px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#4f9a5a,#1f5a2c);box-shadow:0 4px 0 #123a1b}
.banqueta::after{content:"";position:absolute;left:18px;right:18px;top:20px;height:40px;border-left:7px solid #1A1024;border-right:7px solid #1A1024}
#banda,#publico{pointer-events:none}
/* tele colgada: la pantalla va detrás del marco (pantalla del marco transparente) */
#tele{position:absolute;left:8px;top:62px;width:230px;height:180px;pointer-events:none}
#tele img{position:absolute}
#teleImg{left:13px;top:61px;width:205px;height:99px;object-fit:cover;filter:brightness(1.05) saturate(1.1);transition:opacity .35s}
#tele .marco{left:0;top:0;width:230px}
#teleGol{position:absolute;left:0;right:0;top:88px;text-align:center;font:400 32px var(--display);color:#ffe34d;text-shadow:0 3px 0 #b3261e,0 0 14px #000;animation:latido .5s infinite}
#teleGol[hidden]{display:none}
.festeja{animation:festeja .35s ease-in-out 6 alternate}
@keyframes festeja{to{transform:translateY(-100%) translateY(-8px)}}
#publico img{position:absolute}
#banda img{filter:drop-shadow(0 6px 6px #0009)}
.musico{animation:tocar .55s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes tocar{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-5px) rotate(1.5deg)}}
.nota{position:absolute;top:190px;font:44px var(--display);color:#ffd36b;text-shadow:0 2px 4px #000;opacity:0;animation:nota 3.2s linear infinite}
@keyframes nota{0%{transform:translateY(0) rotate(-10deg);opacity:0}15%{opacity:1}100%{transform:translateY(-230px) rotate(15deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.nota{animation:none;opacity:.8}}
.hit:active{background:#ffffff22}
.tecla{position:absolute;min-width:34px;height:34px;padding:0 6px;border-radius:9px;background:#160B24cc;border:2px solid var(--ambar);color:var(--ambar);
  font:20px/30px var(--display);text-align:center;pointer-events:none;z-index:5}
.hit{position:absolute;cursor:pointer;border-radius:16px}
.hit:focus-visible{outline:4px solid var(--ambar)}
.anillo{position:absolute;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ambar) var(--p,0%),#0009 0);
  box-shadow:0 0 0 4px #000a;display:grid;place-items:center;pointer-events:none}
.anillo::after{content:"";width:44px;height:44px;border-radius:50%;background:#160B24}
.listo{animation:latido .7s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.08)}}
.peligro{animation:peligro .25s steps(2) infinite}
@keyframes peligro{50%{filter:brightness(1.6) saturate(.4)}}
.raya{position:absolute;left:6px;right:6px;top:2px;height:20px;border-top:3px dashed #7dff6a;border-bottom:3px dashed #7dff6a;background:#7dff6a33;pointer-events:none;box-shadow:0 0 8px #7dff6a}
.raya[hidden]{display:none}
.chorro{position:absolute;width:9px;border-radius:5px;pointer-events:none}
.apagado{filter:grayscale(1) brightness(.45)}
.candado{position:absolute;font-size:34px;pointer-events:none;text-shadow:0 2px 0 #000}
/* clientes */
.cli{position:absolute;width:300px;height:470px;transition:transform .45s ease-out,opacity .45s;pointer-events:none}
.cli.fuera{transform:translateY(60px);opacity:0}
.cli .cara{left:50%;bottom:0;height:300px;transform:translateX(-50%)}
.cli .globo{left:45px;top:0;width:210px}
.cli .items{position:absolute;left:50px;top:10px;width:200px;height:92px;display:flex;justify-content:center;align-items:center;gap:4px}
.cli .items span{position:relative;width:62px;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cli .items img{position:static!important;max-width:58px;max-height:58px}
.cli .items em{font:normal 17px/1 var(--display);color:#1A1024;margin-top:3px;white-space:nowrap}
.cartel-canilla{position:absolute;height:30px;padding:0 8px;border-radius:9px;font:19px/26px var(--display);text-align:center;transform:translateX(-50%);
  pointer-events:none;border:2px solid #0006;box-shadow:0 3px 0 #0007;z-index:4}
.cli .items span.ok img{opacity:.35}
.cli .items span.ok::after{content:"✔";position:absolute;font:28px var(--display);color:#3bd16b;text-shadow:0 2px 0 #000}
.cli.cuatro .items{gap:0;left:42px;width:216px}
.cli.cuatro .items span{width:54px}
.cli.cuatro .items img{max-width:46px;max-height:46px}
.cli.cuatro .items em{font-size:14px}
.etiqueta-cli{position:absolute;left:50%;top:128px;transform:translateX(-50%);background:#c9302c;color:#fff;font:22px var(--display);
  padding:2px 12px;border-radius:12px;border:2px solid #fff8;box-shadow:0 3px 0 #0007;white-space:nowrap}
.pac{position:absolute;left:78px;top:104px;width:144px;height:12px;border-radius:7px;background:#0007;overflow:hidden}
.pac i{display:block;height:100%;width:100%;border-radius:7px;transition:background .3s}
/* pizarra del fondo y cartel del bar */
.pizarra{position:absolute;left:382px;top:204px;width:180px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--tiza);color:#f4efe2;text-align:center;line-height:1;pointer-events:none;text-shadow:0 0 2px #fff6;transform:rotate(-1.5deg)}
.pizarra span{font-size:24px}
.pizarra b{font-weight:400;font-size:40px;color:#ffd36b;letter-spacing:1px}
.pizarra small{font-size:17px;margin-top:6px;color:#cfe8ff}
.cartel-bar{display:flex;flex-direction:column;align-items:center;background:linear-gradient(#8a4b1f,#5b2f14);border:4px solid #0D0616;border-radius:14px;
  padding:4px 26px 6px;box-shadow:0 6px 0 var(--sombra),inset 0 2px 0 #7A3FB8;position:relative}
.cartel-bar::before,.cartel-bar::after{content:"";position:absolute;top:-22px;width:4px;height:22px;background:#160B24}
.cartel-bar::before{left:30px}.cartel-bar::after{right:30px}
.cartel-bar b{font:400 32px/1.05 var(--display);color:var(--ambar);text-shadow:0 3px 0 #0D0616;letter-spacing:.5px}
.cartel-bar span{font:800 19px var(--texto);color:var(--crema)}
/* mejoras */
.mejoras{display:grid;grid-template-columns:repeat(2,400px);gap:14px;margin:8px 0 14px}
.mej{background:#160B24cc;border:3px solid var(--madera-cl);border-radius:20px;padding:8px 14px;display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;text-align:left}
.mej .ico{width:84px;height:84px;display:grid;place-items:center;font-size:58px}
.mej:last-child{grid-column:1/-1;width:400px;justify-self:center}
.mej .ico img{position:static!important;max-width:84px;max-height:84px}
.mej h3{margin:0;font:400 26px var(--display);color:var(--ambar)}
.mej p{margin:2px 0 6px;font:600 17px var(--texto)}
.mej .pts{display:flex;gap:6px;margin-bottom:6px}
.mej .pts i{width:22px;height:22px;border-radius:50%;background:#0007;border:2px solid var(--madera-cl)}
.mej .pts i.on{background:var(--ambar)}
.mej button{font:22px var(--display);border:0;border-radius:12px;padding:6px 14px;background:var(--ambar);color:#1A1024;cursor:pointer;box-shadow:0 4px 0 #A87800}
.mej button:disabled{background:#5A4A72;color:#160B24;box-shadow:none;cursor:default}
.banco{display:inline-flex;align-items:center;gap:10px;font:40px var(--display);color:var(--ambar)}
.banco img{position:static!important;width:50px}
.btn-mejoras{position:absolute;left:600px;top:790px;width:900px;font:34px var(--display);background:var(--verde);color:#fff;border:4px solid #37D6C0;border-radius:22px;
  padding:12px;box-shadow:0 7px 0 #0E5A4F;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:16px}
.btn-mejoras img{position:static!important;width:44px}
/* HUD */
.volver{position:absolute;left:18px;top:14px;z-index:45;width:64px;height:64px;border-radius:18px;border:3px solid var(--agua);background:#160B24dd;color:var(--crema);
  font:44px/1 var(--display);cursor:pointer;box-shadow:0 5px 0 var(--sombra)}
.volver:focus-visible{outline:4px solid var(--ambar)}
.hud{position:absolute;top:14px;left:100px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:20}
.chip{display:flex;align-items:center;gap:10px;background:#160B24dd;border:3px solid var(--madera-cl);border-radius:18px;padding:6px 18px 6px 8px;
  font:34px var(--display);color:var(--ambar);box-shadow:0 5px 0 var(--sombra);font-variant-numeric:tabular-nums}
.chip img{position:static!important;width:44px}
.corazones{display:flex;gap:6px}
.corazones img{position:static!important;width:46px}
.corazones img.perdido{filter:grayscale(1) brightness(.4)}
.btn-pausa{pointer-events:auto;width:64px;height:64px;border-radius:18px;border:3px solid var(--madera-cl);background:#160B24dd;color:var(--crema);font:30px var(--display)}
/* textos flotantes */
.flota{position:absolute;font:40px var(--display);color:var(--ambar);text-shadow:0 3px 0 var(--madera),0 0 12px #000;pointer-events:none;
  animation:flota 1.1s ease-out forwards;white-space:nowrap;z-index:15}
@keyframes flota{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-14px) scale(1.1);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.vuela{transition:left .45s cubic-bezier(.4,0,.2,1),top .45s cubic-bezier(.4,0,.2,1),transform .45s;z-index:14}
.ayuda{position:absolute;left:50%;top:418px;transform:translateX(-50%);background:#160B24ee;border:3px solid var(--ambar);border-radius:18px;
  padding:6px 18px;font:600 22px var(--texto);max-width:1000px;text-align:center;pointer-events:none;z-index:18;transition:opacity .5s}
/* pantallas */
.pantalla{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#160B24cc}
.pantalla[hidden]{display:none}
.caja{background:linear-gradient(#3A1D5C,#1A1024);border:5px solid var(--ambar);border-radius:30px;padding:30px 44px;text-align:center;box-shadow:0 12px 0 var(--sombra);max-width:900px}
#fin{background:#160B2455}
.arrastrable{touch-action:none;position:relative}
.agarre{font:800 20px var(--texto);color:#F6EFE2;opacity:.8;margin:-14px 0 6px;cursor:grab;user-select:none}
.caja h2{font:400 64px var(--display);color:var(--ambar);margin:0 0 10px;text-shadow:0 4px 0 #0D0616}
.caja p{font:600 28px var(--texto);margin:0 0 18px}
.boton{font:36px var(--display);background:var(--ambar);color:#1A1024;border:0;border-radius:20px;padding:14px 38px;box-shadow:0 6px 0 #A87800;cursor:pointer;margin:6px}
.boton.sec{background:#F6EFE2}
.boton:focus-visible{outline:4px solid #fff}
.estrellas{display:flex;justify-content:center;gap:14px;margin:6px 0 14px}
.estrellas img{position:static!important;width:100px}
.estrellas img.no{filter:grayscale(1) brightness(.35)}
.nuevos{display:flex;justify-content:center;gap:22px;margin:4px 0 20px;flex-wrap:wrap}
.nuevos div{display:flex;flex-direction:column;align-items:center;font:24px var(--display);gap:4px}
.nuevos img{position:static!important;height:96px}
/* menú */
#menu{background:none}
#menu .fondo{left:0;top:0;width:1600px;height:900px;filter:blur(3px) brightness(.55)}
#menu .barman{left:60px;bottom:0;height:640px}
.titulo{position:absolute;left:560px;top:60px;width:980px;text-align:center}
.titulo h1{font:400 112px/1 var(--display);color:var(--ambar);margin:0;text-shadow:0 8px 0 #1A1024,0 0 40px #000}
.titulo p{font:800 30px var(--texto);margin:12px 0 0;text-shadow:0 2px 6px #000}
.niveles{position:absolute;left:600px;top:330px;width:900px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.nivel{height:200px;border-radius:26px;border:4px solid var(--ambar);background:linear-gradient(#3A1D5C,#1B0D2E);color:var(--crema);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 0 var(--sombra);font-family:var(--display)}
.nivel b{font-weight:400;font-size:66px;color:var(--ambar);line-height:1}
.nivel small{font:800 22px var(--texto)}
.nivel .mini{display:flex;gap:4px}
.nivel .mini img{position:static!important;width:38px}
.nivel .mini img.no{filter:grayscale(1) brightness(.35)}
.nivel[disabled]{opacity:.5;cursor:default}
.nivel:focus-visible{outline:5px solid #fff}
  text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));font:800 22px var(--texto)}
@media (prefers-reduced-motion:reduce){.listo,.peligro{animation:none}}
</style>

</head>
<body>
<div id="escena">
  <div class="capa" id="juego">
    <img src="assets/cerveceria/fondo.webp" alt="" style="left:0;top:0;width:1600px;height:900px">
    <div class="pizarra" aria-hidden="true"><span>Cervecería</span><b id="pizarraNombre">DURAZNO</b><small>Golden · Roja · IPA · Stout</small><small id="pizMejoras" style="font-size:22px"></small></div>
    <div id="tele" aria-hidden="true"><img id="teleImg" src="assets/cerveceria/tv_partido.webp" alt=""><img src="assets/cerveceria/tele.webp" alt="" class="marco"><b id="teleGol" hidden>¡GOOOL!</b></div>
    <div class="capa" id="publico"></div>
    <div class="capa" id="banda"></div>
    <div class="capa" id="clientes"></div>
    <div class="capa" id="deco"></div>
    <img src="assets/cerveceria/barra.webp" alt="" style="left:-20px;top:520px;width:1640px">

      <div class="chip"><img src="assets/cerveceria/moneda.webp" alt=""><span id="monedas">0</span></div>
      <div class="cartel-bar"><b id="cartelNombre">Cervecería Durazno</b><span>👥 <span id="progreso">0/0</span> clientes</span></div>

        <button class="btn-pausa" id="pausa" aria-label="Pausa">II</button></div>

  <div class="pantalla" id="menu">
    <img class="fondo" src="assets/cerveceria/fondo.webp" alt="">

    <div class="titulo"><h1>¡Tirame una Birra!</h1><p>Abrí la <b style="color:var(--ambar)">Cervecería Durazno</b>: tirá pintas, freí papas y que nadie se vaya enojado.</p></div>
    <div class="niveles" id="niveles"></div>
    <button class="btn-mejoras" id="abrirMejoras"><img src="assets/cerveceria/moneda.webp" alt=""><span>Mejorar la cervecería · <span id="bancoMenu">0</span></span></button>

  <div class="pantalla" id="pantMejoras" hidden><div class="caja" style="max-width:980px;padding:16px 40px 20px">

<script>
const $=id=>document.getElementById(id);
const esc=$("escena");
/* La app de Play va siempre parada: con el celular parado la escena se gira 90° (se juega con el celular acostado). */
let ESC_S=1,ROT=false;
function ajustar(){ROT=innerHeight>innerWidth;
  ESC_S=ROT?Math.min(innerWidth/900,innerHeight/1600):Math.min(innerWidth/1600,innerHeight/900);
  esc.style.transform=`translate(-50%,-50%)${ROT?" rotate(90deg)":""} scale(${ESC_S})`;}
addEventListener("resize",ajustar);ajustar();
/* Música de la banda: suena en loop de fondo (nivel 1 guitarra, nivel 2 trompeta) (respeta el sonido del juego principal) */
const MUSICA={0:"assets/cerveceria/musica-nivel1.mp3",1:"assets/cerveceria/musica-nivel2.mp3"};
let musica=null;
function musicaPlay(){
  const src=MUSICA[nivelIdx];if(!src||!sonidoOk()){musicaStop();return;}
  if(!musica||!musica.src.endsWith(src)){musicaStop();musica=new Audio(src);musica.loop=true;}
  musica.volume=Math.min(.6,.3+.08*(mej.musica||0));   /* la mejora "Banda en vivo" la hace sonar un poco más fuerte */
  const pr=musica.play();if(pr&&pr.catch)pr.catch(()=>{});
}
function musicaPausa(){if(musica)musica.pause();}
function musicaStop(){if(musica){musica.pause();musica.currentTime=0;}}
function salirJuego(){jugando=false;musicaStop();try{if(parent!==window&&parent.Extensiones){parent.Extensiones.abrirLobby();return;}}catch(e){}location.href="index.html";}
$("volver").onclick=salirJuego;
/* botón atrás de Android (index.html llama a gyaAtras): cierra lo abierto; en el menú devuelve false y sale */
window.gyaAtras=()=>{
  if(!$("pantMejoras").hidden){$("pantMejoras").hidden=true;despuesMejoras=null;$("menu").hidden=false;pintarMenu();return true;}
  if(!$("pantPausa").hidden){$("pSeguir").click();return true;}
  if(jugando){$("pausa").click();return true;}
  if(!$("intro").hidden||!$("fin").hidden){$("intro").hidden=true;$("fin").hidden=true;pintarMenu();$("menu").hidden=false;return true;}
  return false;
};

/* ---------- sonido (se activa con el primer toque) ---------- */
let ac=null;
function sonidoOk(){try{return parent===window||typeof parent.sonidoPermitido!=="function"||parent.sonidoPermitido();}catch(e){return true;}}
function bip(f,d=.12,tipo="sine",vol=.12,f2){if(!sonidoOk())return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=tipo;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const sonMoneda=()=>{bip(988,.08,"square",.06);setTimeout(()=>bip(1319,.18,"square",.06),70);};
const sonError=()=>bip(180,.25,"sawtooth",.07,90);
const sonListo=()=>bip(660,.1,"triangle",.1);

/* Canilla: UN TOQUE corto = se llena sola y después la tocás para servirla (sin premio ni castigo).
   MANTENERLA APRETADA = modo experto: La birra sube mientras apretás y al soltar se la lleva el cliente.
   Soltar en la franja verde (86-102%) = "¡Espuma justa!" (más propina). Antes = poca birra; después = mucha espuma:
   el cliente se enoja (pierde paciencia y no deja propina por esa pinta). Si no soltás nunca, se rebalsa y va al tacho. */
const RAYA=[.86,1.02];
function apretarCanilla(c){
  if(!jugar())return;if(!c.habil){sacudir(c.hit);sonError();return;}
  c.abajo=performance.now();c.apretado=true;
  if(c.estado==="vacio"){c.nivel=0;c.calidad=null;c.auto=false;c.estado="sirviendo";c.t=0;bip(320,.2,"triangle",.05,200);ocultarAyuda(1);}
  else if(c.estado==="lista"){c.apretado=false;if(servir(c.k,c.sx,760,c.calidad)){c.estado="vacio";c.t=0;}else sacudir(c.vaso);}
  else if(c.estado==="rebalsada"){c.apretado=false;tirar(c.sx,760,"rebalsada");c.estado="vacio";c.t=0;}
}
function soltarCanilla(c){
  if(!c.apretado)return;c.apretado=false;if(c.estado!=="sirviendo")return;
  if(performance.now()-c.abajo<280){c.auto=true;return;}      /* fue un toque: se llena sola */
  c.calidad=c.nivel<RAYA[0]?"poca":c.nivel>RAYA[1]?"mucha":"justa";
  c.estado="lista";c.t=0;c.vaso.classList.add("listo");
  if(c.calidad==="justa"){flotar("¡Espuma justa!",c.sx,690,"#9cf06a");bip(880,.08,"triangle",.1);setTimeout(()=>bip(1175,.15,"triangle",.1),80);}
  else flotar(c.calidad==="poca"?"Poca birra…":"Mucha espuma…",c.sx,690,"#ff8a8a");
  /* se la entrega sola al cliente que la pidió (si nadie la pidió, queda lista en la canilla) */
  if(clientes.some(x=>x.estado==="espera"&&x.pend.includes(c.k))&&servir(c.k,c.sx,760,c.calidad)){c.estado="vacio";c.t=0;}
}
function tocarCanilla(c){apretarCanilla(c);soltarCanilla(c);}
function tocarFreidora(f){
  if(!f)f=freidoras.find(x=>x.estado==="lista"||x.estado==="quemada")||freidoras.find(x=>x.estado==="vacia")||freidoras[0];
  if(!jugar())return;if(!f.habil){sacudir(f.hit);sonError();return;}
  if(f.estado==="vacia"){f.estado="friendo";f.t=0;bip(200,.3,"sawtooth",.03,120);}
  else if(f.estado==="lista"){if(servir("papas",f.cx,600)){f.estado="vacia";}else sacudir(f.comida);}
  else if(f.estado==="quemada"){tirar(f.cx,600,"papas_q");f.estado="vacia";}
}
function tocarPlancha(s){
  if(!jugar())return;if(!s.habil){sacudir(s.hit);sonError();return;}
  if(s.estado==="vacia"){s.estado="cocinando";s.t=0;bip(240,.3,"sawtooth",.03,140);}
  else if(s.estado==="lista"){if(servir("burger",s.cx,720)){s.estado="vacia";}else sacudir(s.comida);}
  else if(s.estado==="quemada"){tirar(s.cx,720,"burger_q");s.estado="vacia";}
}
function tocarPicada(){
  if(!jugar())return;const pc=picadaE;if(!pc.habil){sacudir(pc.hit);sonError();return;}
  if(pc.estado==="vacia"){pc.estado="armando";pc.t=0;}
  else if(pc.estado==="lista"){if(servir("picada",1510,800)){pc.estado="vacia";}else sacudir(pc.comida);}
}
function tirar(x,y,src){volar(src,x-40,y-60,80,83,760);sonError();tachoEl.animate([{transform:"rotate(0)"},{transform:"rotate(-8deg)"},{transform:"rotate(6deg)"},{transform:"rotate(0)"}],{duration:300});}

/* ---------- clientes ---------- */
function nuevoPedido(n){
  n=n||1+Math.floor(Math.random()*N.max);const orden=[N.birras[Math.floor(Math.random()*N.birras.length)]];
  const pool=N.birras.concat(N.extras,N.extras);
  while(orden.length<n){const k=pool[Math.floor(Math.random()*pool.length)];if(orden.filter(x=>x===k).length<2)orden.push(k);}
  return orden;
}
/* Especiales: el GOLOSO pide 4 cosas (espera un poco más y paga el doble de propina);
   la BARRA DE AMIGOS llega de a 3 juntos: si atendés a los 3, bono para todos. */
let grupoSig=1;
/* bolsa mezclada: salen todos los personajes antes de repetir, y nunca uno que ya está en la barra */
let bolsa=[];
function sacarPersona(){
  if(!bolsa.length)bolsa=PERSONAS.slice().sort(()=>Math.random()-.5);
  const enBarra=clientes.map(c=>c.persona);let i=bolsa.findIndex(p=>!enBarra.includes(p));if(i<0)i=0;
  return bolsa.splice(i,1)[0];
}
function libresSlots(){return SLOTS.map((x,i)=>i).filter(i=>!clientes.some(c=>c.slot===i));}
function llegaEspecial(){
  const prob=nivelIdx>=4?.3:.18,quedan=N.clientes-generados;
  if(nivelIdx>=2&&Math.random()<prob&&libresSlots().length>=3&&quedan>=3){
    const g=grupoSig++;grupos[g]={total:3,pagados:0,fallo:false};for(let i=0;i<3;i++)llegaCliente({grupo:g,n:1+Math.floor(Math.random()*2)});flotar("¡Llegó la barra de amigos!",800,330,"#ffd36b");return true;}
  if(nivelIdx>=1&&Math.random()<prob&&libresSlots().length){llegaCliente({goloso:true,n:4});return true;}
  return false;
}
const grupos={};
function bonoGrupo(c){const g=grupos[c.grupo];if(!g)return 0;g.pagados++;return !g.fallo&&g.pagados===g.total?15*g.total:0;}
function llegaCliente(op){
  op=op||{};const libres=libresSlots();if(!libres.length)return false;
  const slot=libres[Math.floor(Math.random()*libres.length)],persona=sacarPersona();
  const orden=nuevoPedido(op.n),base=orden.reduce((a,k)=>a+P[k].precio,0);baseTotal+=base;generados++;
  const el=div("cli fuera"+(orden.length>3?" cuatro":""),`left:${SLOTS[slot]-150}px;top:90px`,$("clientes"));
  const cara=img("c_"+persona+"_0",0,0,0,el);cara.className="cara";cara.style.cssText="";
  const glo=img("globo",0,0,210,el);glo.className="globo";glo.style.cssText="";
  const items=div("items","",el);
  const iEls=orden.map(k=>{const s=document.createElement("span");s.innerHTML=`<img src="assets/cerveceria/${P[k].img}.webp" alt=""><em>${P[k].corto||P[k].nombre}</em>`;items.appendChild(s);return s;});
  const pac=div("pac","",el),barra=document.createElement("i");pac.appendChild(barra);
  const pacMax=(N.pac*PACIENCIA[persona]+(orden.length-1)*2+(op.goloso?6:0)+(op.grupo?4:0))*extraPaciencia();
  if(op.goloso||op.grupo){const t=div("etiqueta-cli",op.grupo?"background:#2f6fb0":"",el);t.textContent=op.grupo?"👯 Amigos":"⭐ Goloso";}
  const c={grupo:op.grupo||0,goloso:!!op.goloso,slot,persona,orden,pend:orden.slice(),entregados:orden.map(()=>false),iEls,el,cara,barra,pac:pacMax,pacMax,estado:"espera",base,cx:SLOTS[slot],cara_i:0};
  clientes.push(c);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove("fuera")));
  bip(523,.08,"triangle",.06);
  return true;
}
function ponerCara(c,i){if(c.cara_i===i)return;c.cara_i=i;c.cara.src=`assets/cerveceria/c_${c.persona}_${i}.webp`;}
function servir(k,x,y,calidad){
  const cands=clientes.filter(c=>c.estado==="espera"&&c.pend.includes(k)).sort((a,b)=>a.pac/a.pacMax-b.pac/b.pacMax);
  if(!cands.length){const faltan=[...new Set(clientes.filter(c=>c.estado==="espera").flatMap(c=>c.pend).filter(q=>P[q].birra))];
    flotar(P[k].birra&&faltan.length?"Piden: "+faltan.map(q=>P[q].nombre).join(", "):"Nadie pidió "+P[k].nombre,x,y-40,"#ffb3a8");sonError();return false;}
  const c=cands[0];c.pend.splice(c.pend.indexOf(k),1);
  const idx=c.orden.findIndex((o,i)=>o===k&&!c.entregados[i]);c.entregados[idx]=true;c.iEls[idx].classList.add("ok");
  if(calidad==="justa")c.espumas=(c.espumas||0)+1;
  if(calidad==="poca"||calidad==="mucha"){c.malas=(c.malas||0)+1;c.pac-=c.pacMax*.3;
    setTimeout(()=>{flotar(calidad==="poca"?"¡Me diste poca!":"¡Puro espuma!",c.cx,200,"#ff8a8a");sonError();},300);
    if(c.pend.length)ponerCara(c,2);}
  volar(P[k].img,x-40,y-60,80,c.cx,140);sonListo();
  if(!c.pend.length)pagar(c);
  return true;
}
function pagar(c){
  c.estado="contento";ponerCara(c,0);
  const r=Math.max(0,c.pac/c.pacMax),propina=Math.round(c.base*.5*r*extraPropina()*(c.goloso?2:1)*(c.malas?0:1));
  combo=(reloj-ultimoPago<3.5)?combo+1:0;ultimoPago=reloj;const bonus=combo*3;
  const espuma=Math.round((c.espumas||0)*4*extraPropina());
  const grupo=c.grupo?bonoGrupo(c):0;
  const total=c.base+propina+bonus+espuma+grupo;monedas+=total;atendidos++;pintarHud();
  setTimeout(()=>{flotar("+"+total,c.cx,170);sonMoneda();
    if(propina>0)setTimeout(()=>flotar("propina +"+propina,c.cx,230,"#9cf06a"),220);
    if(bonus)setTimeout(()=>flotar("¡COMBO x"+(combo+1)+"!",c.cx,290,"#ffd36b"),440);
    if(espuma)setTimeout(()=>flotar("espuma justa +"+espuma,c.cx,350,"#b6ffa8"),660);
    if(grupo)setTimeout(()=>flotar("¡La barra contenta! +"+grupo,c.cx,410,"#ffd36b"),880);
    if(r>.72){const d=img("destello",c.cx-150,60,300,$("efectos"));d.animate([{transform:"scale(.3)",opacity:0},{transform:"scale(1.05)",opacity:1,offset:.3},{transform:"scale(1.2)",opacity:0}],{duration:900});setTimeout(()=>d.remove(),900);
      flotar("¡PERFECTO!",c.cx,110,"#fff2a8");}
  },150);
  setTimeout(()=>sentar(c),1300);irse(c,900);
}
/* Mesas del fondo: arrancan vacías y cada cliente atendido va a sentarse de espaldas a mirar la banda (el bar se llena).
   Las imágenes de sentados traen su mesa: se cambia la mesa vacía por la mesa con el cliente. */
const MESAS=[[600,505,82],[850,505,82],[470,565,110],[720,565,110],[970,565,110]];   /* [centro x, base y, ancho de la mesa] */
let ocupados=0;
function ponerMesa(k,persona){
  const [cx,by,D]=MESAS[k],pub=$("publico");let el=pub.children[k];
  const src=persona?(k<2?`d_${persona}`:`s_${persona}`):"mesa"   /* las 2 del fondo miran a la derecha (hacia la banda) */,w=persona?D/.45:D/.583,izq=cx-w*(persona?.627:.502);
  const nuevo=document.createElement("img");nuevo.src=`assets/cerveceria/${src}.webp`;nuevo.alt="";nuevo.className="mesa"+(persona?" sentado":"");
  nuevo.style.cssText=`left:${izq}px;top:${by}px;width:${w}px;transform:translateY(-100%);filter:brightness(${D<100?.72:.86})`;
  if(el)pub.replaceChild(nuevo,el);else pub.appendChild(nuevo);
  if(persona)nuevo.animate([{opacity:0},{opacity:1}],{duration:700});
}
function armarMesas(){ocupados=0;$("publico").innerHTML="";MESAS.forEach((m,k)=>ponerMesa(k,null));}
function sentar(c){if(ocupados>=MESAS.length)return;ponerMesa(ocupados++,c.persona);}
function irse(c,ms){setTimeout(()=>{c.el.classList.add("fuera");setTimeout(()=>{c.el.remove();clientes=clientes.filter(x=>x!==c);revisarFin();},460);},ms);}
function enojarse(c){if(c.grupo&&grupos[c.grupo])grupos[c.grupo].fallo=true;
  c.estado="enojado";ponerCara(c,2);vidas--;perdidos++;pintarHud();sonError();flotar("¡Me voy!",c.cx,170,"#ff8a8a");
  const h=$("corazones").children[vidas];if(h)h.animate([{transform:"scale(1.6)"},{transform:"scale(1)"}],{duration:400});
  irse(c,1100);
  if(vidas<=0)setTimeout(()=>terminar(false),1300);
}

/* ---------- bucle ---------- */
let antes=performance.now();
function bucle(ahora){
  const dt=Math.min(.05,(ahora-antes)/1000);antes=ahora;
  if(jugar())actualizar(dt);
  requestAnimationFrame(bucle);
}
function actualizar(dt){
  reloj+=dt;
  // llegada de clientes
  proxLlegada-=dt;
  if(generados<N.clientes&&proxLlegada<=0){if(llegaEspecial()||llegaCliente())proxLlegada=N.llegada[0]+Math.random()*(N.llegada[1]-N.llegada[0]);else proxLlegada=.6;}
  // paciencia
  clientes.forEach(c=>{if(c.estado!=="espera")return;c.pac-=dt;const r=Math.max(0,c.pac/c.pacMax);
    c.barra.style.width=(r*100)+"%";c.barra.style.background=r>.55?"#46d36b":r>.28?"#ffc23d":"#ff4d4d";
    ponerCara(c,r>.55?0:r>.25?1:2);if(c.pac<=0)enojarse(c);});
  // canillas
  canillas.forEach(c=>{if(!c.habil)return;c.t+=dt;
    if(c.estado==="sirviendo"){c.nivel+=dt/T.pinta;const f=Math.min(1,c.nivel);c.lleno.style.clipPath=`inset(${(1-f)*100}% 0 0 0)`;c.chorro.style.height=(735+150-(150*f)-728)+"px";
      if(c.auto&&c.nivel>=1){c.estado="lista";c.t=0;c.calidad=null;c.vaso.classList.add("listo");sonListo();}
      else if(!c.auto&&c.nivel>1.15){c.estado="rebalsada";c.t=0;c.apretado=false;sonError();flotar("¡Se rebalsó!",c.sx,690,"#ff8a8a");}}
    else if(c.estado==="pausada"){c.chorro.style.height="0";}
    else if(c.estado==="lista"){c.vaso.classList.toggle("peligro",c.t>T.rebalsa*.6);if(c.t>T.rebalsa){c.estado="rebalsada";c.t=0;sonError();}}
    pintarCanilla(c);});
  // freidora
  freidoras.forEach(f=>{if(!f.habil)return;f.t+=dt;
    if(f.estado==="friendo"&&f.t>=T.papas){f.estado="lista";f.t=0;sonListo();}
    else if(f.estado==="lista"&&f.t>=T.quema){f.estado="quemada";f.t=0;sonError();}
    pintarCocina(f,T.papas,"papas","papas_q","friendo");});
  plancha.forEach(s=>{if(!s.habil)return;s.t+=dt;
    if(s.estado==="cocinando"&&s.t>=T.burger){s.estado="lista";s.t=0;sonListo();}
    else if(s.estado==="lista"&&s.t>=T.quema){s.estado="quemada";s.t=0;sonError();}
    pintarCocina(s,T.burger,"burger","burger_q","cocinando");});
  const pc=picadaE;if(pc.habil){pc.t+=dt;if(pc.estado==="armando"&&pc.t>=T.picada){pc.estado="lista";sonListo();}
    pc.comida.style.opacity=pc.estado==="vacia"?.35:pc.estado==="armando"?.35+.65*Math.min(1,pc.t/T.picada):1;
    pc.comida.style.filter=pc.estado==="lista"?"":"grayscale(1)";pc.comida.classList.toggle("listo",pc.estado==="lista");
    pc.anillo.style.display=pc.estado==="armando"?"grid":"none";pc.anillo.style.setProperty("--p",(100*pc.t/T.picada)+"%");}
}
function pintarCanilla(c){
  const e=c.estado;c.raya.hidden=!(e==="sirviendo"&&!c.auto);
  const pasada=e==="rebalsada"||(e==="sirviendo"&&!c.auto&&c.nivel>RAYA[1]);   /* te estás pasando: se ve la espuma desbordando */
  c.lleno.style.display=pasada?"none":"";c.rebalse.style.display=pasada?"":"none";
  if(e==="vacio"){c.lleno.style.clipPath="inset(100% 0 0 0)";c.chorro.style.height="0";c.vaso.classList.remove("listo","peligro");}
  if(e==="rebalsada"){c.vaso.classList.remove("listo","peligro");c.chorro.style.height="0";}
}
function pintarCocina(s,tiempo,src,srcQ,cocinando){
  const e=s.estado;
  s.comida.style.display=s.habil?"":(e==="vacia"?"none":"");
  if(e==="vacia"){s.comida.src="assets/cerveceria/"+src+".webp";s.comida.style.filter="saturate(.7)";s.comida.style.opacity=.5;}
  if(e===cocinando){s.comida.src="assets/cerveceria/"+src+".webp";s.comida.style.filter="saturate(.25) brightness(1.25)";s.comida.style.opacity=.55;}
  else if(e==="lista"){s.comida.src="assets/cerveceria/"+src+".webp";s.comida.style.filter="";s.comida.style.opacity=1;}
  else if(e==="quemada"){s.comida.src="assets/cerveceria/"+srcQ+".webp";s.comida.style.filter="brightness(.5) contrast(1.2)";s.comida.style.opacity=1;}
  s.comida.classList.toggle("listo",e==="lista"&&s.t<T.quema*.6);s.comida.classList.toggle("peligro",e==="lista"&&s.t>=T.quema*.6);
  s.anillo.style.display=e===cocinando?"grid":"none";s.anillo.style.setProperty("--p",(100*Math.min(1,s.t/tiempo))+"%");
}
requestAnimationFrame(bucle);

/* ---------- HUD, ayuda y pantallas ---------- */
function pintarHud(){
  $("monedas").textContent=monedas;$("progreso").textContent=(atendidos+perdidos)+"/"+N.clientes;
  const h=$("corazones");if(h.children.length!==3){h.innerHTML="";for(let i=0;i<3;i++)img("corazon",0,0,46,h);}
  [...h.children].forEach((x,i)=>x.classList.toggle("perdido",i>=vidas));
}
let pasoAyuda=0;
/* la ayuda va sobre la barra (no tapa los globitos) y se va sola a los 5 s o con cualquier toque */
function mostrarAyuda(t){const a=$("ayuda");a.textContent=t;a.hidden=false;a.style.opacity=1;clearTimeout(mostrarAyuda.t);mostrarAyuda.t=setTimeout(quitarAyuda,5000);}
function quitarAyuda(){const a=$("ayuda");a.style.opacity=0;setTimeout(()=>a.hidden=true,500);}
esc.addEventListener("pointerdown",()=>{if(!$("ayuda").hidden)setTimeout(quitarAyuda,1200);});
function ocultarAyuda(paso){if(nivelIdx!==0||paso<pasoAyuda)return;pasoAyuda=paso+1;
  if(paso===1)mostrarAyuda("Cuando el vaso esté lleno, tocalo para servirlo. Experto: mantené apretada la canilla y soltá en la franja verde.");
  else{$("ayuda").style.opacity=0;setTimeout(()=>$("ayuda").hidden=true,500);}}
function revisarFin(){if(jugando&&vidas>0&&generados>=N.clientes&&!clientes.length)terminar(true);}
function calcEstrellas(){return monedas>=baseTotal*1.38?3:monedas>=baseTotal*1.18?2:1;}
function terminar(gano){
  if(!jugando)return;jugando=false;musicaStop();banco+=monedas;guardarBanco();
  const f=$("fin");f.hidden=false;const e=$("finEstrellas");e.innerHTML="";
  if(gano){const n=calcEstrellas();estrellasGuardadas[nivelIdx]=Math.max(estrellasGuardadas[nivelIdx]||0,n);guardarEstrellas();
    $("finTitulo").textContent=n===3?"¡Crack de la barra!":n===2?"¡Bien ahí!":"¡Lo lograste!";
    for(let i=0;i<3;i++){const s=img("estrella",0,0,100,e);if(i>=n)s.classList.add("no");else s.animate([{transform:"scale(0)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:450,delay:250*i,fill:"backwards"});}
    $("finTexto").textContent=`Ganaste ${monedas} monedas (tenés ${banco} para mejorar la cervecería) y atendiste a ${atendidos} de ${N.clientes} clientes.`;
    $("finSeguir").hidden=nivelIdx>=NIVELES.length-1;sonMoneda();
  }else{$("finTitulo").textContent="¡Se te fueron!";$("finTexto").textContent="Se fueron 3 clientes enojados. ¡Probá de nuevo, más rápido!";$("finSeguir").hidden=true;}
}
function pintarMenu(){
  const c=$("niveles");c.innerHTML="";
  NIVELES.forEach((n,i)=>{const b=document.createElement("button");b.className="nivel";const abierto=i===0||(estrellasGuardadas[i-1]||0)>0;b.disabled=!abierto;
    const est=estrellasGuardadas[i]||0;
    b.innerHTML=`<b>${abierto?i+1:"🔒"}</b><small>${i===4?"Happy hour":n.clientes+" clientes"}</small><div class="mini">${[0,1,2].map(k=>`<img src="assets/cerveceria/estrella.webp" alt="" class="${k<est?"":"no"}">`).join("")}</div>`;
    b.onclick=()=>abrirIntro(i);c.appendChild(b);});
}
function abrirIntro(i){armarMesas();
  nivelIdx=i;N=NIVELES[i];$("menu").hidden=true;$("fin").hidden=true;
  $("introTitulo").textContent=i===4?"Nivel 5: Happy hour":"Nivel "+(i+1);$("introTexto").textContent=N.texto;
  const nv=$("introNuevos");nv.innerHTML="";N.nuevos.forEach(k=>{const d=document.createElement("div");d.innerHTML=`<img src="assets/cerveceria/${P[k].img}.webp" alt="">${P[k].nombre}`;nv.appendChild(d);});
  armarPuestos();$("clientes").innerHTML="";$("efectos").innerHTML="";$("ayuda").hidden=true;
  monedas=0;vidas=3;atendidos=perdidos=generados=0;baseTotal=0;clientes=[];pintarHud();
  $("intro").hidden=false;
}
$("introJugar").onclick=()=>{setTimeout(musicaPlay);
  $("intro").hidden=true;aplicarMejoras();jugando=true;pausado=false;reloj=0;proxLlegada=.15;ultimoPago=-9;combo=0;pasoAyuda=0;
  if(nivelIdx===0)mostrarAyuda("Mirá el globito del cliente y TOCÁ la canilla de esa birra.");
};
$("abrirMejoras").onclick=()=>{despuesMejoras=null;pintarMejoras();$("pantMejoras").hidden=false;};
let despuesMejoras=null;
$("finMejoras").onclick=()=>{despuesMejoras=nivelIdx;$("fin").hidden=true;pintarMejoras();$("pantMejoras").hidden=false;};
$("cerrarMejoras").onclick=()=>{$("pantMejoras").hidden=true;$("bancoMenu").textContent=banco;
  if(despuesMejoras!==null){const n=despuesMejoras;despuesMejoras=null;abrirIntro(n);}};
/* al pasar de nivel, primero la tienda de mejoras y después el nivel nuevo */
/* el cartel de fin se puede arrastrar para ver cómo quedó el bar */
(function(){const c=$("finCaja");let x=0,y=0,ini=null;
  c.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;ini={px:e.clientX,py:e.clientY,x,y};c.setPointerCapture(e.pointerId);c.style.cursor="grabbing";});
  c.addEventListener("pointermove",e=>{if(!ini)return;const dx=(e.clientX-ini.px)/ESC_S,dy=(e.clientY-ini.py)/ESC_S;x=ini.x+(ROT?dy:dx);y=ini.y+(ROT?-dx:dy);c.style.transform=`translate(${x}px,${y}px)`;});
  ["pointerup","pointercancel"].forEach(t=>c.addEventListener(t,()=>{ini=null;c.style.cursor="";}));
  new MutationObserver(()=>{if(!$("fin").hidden){x=y=0;c.style.transform="";}}).observe($("fin"),{attributes:true,attributeFilter:["hidden"]});
})();
/* la tele va pasando el partido; cada tanto cae un gol y el bar festeja */
(function(){const P=["tv_partido","tv_patada","tv_partido","tv_red","tv_gol"];let i=0;
  setInterval(()=>{if(pausado)return;i=(i+1)%P.length;const im=$("teleImg");im.style.opacity=0;
    setTimeout(()=>{im.src="assets/cerveceria/"+P[i]+".webp";im.style.opacity=1;},350);
    const gol=P[i]==="tv_gol";$("teleGol").hidden=!gol;
    if(gol&&jugando){bip(523,.12,"square",.05);setTimeout(()=>bip(659,.12,"square",.05),130);setTimeout(()=>bip(784,.3,"square",.05),260);
      document.querySelectorAll("#publico img.sentado").forEach(m=>{m.classList.remove("festeja");void m.offsetWidth;m.classList.add("festeja");});}
  },4000);})();
$("finSeguir").onclick=()=>{despuesMejoras=nivelIdx+1;$("fin").hidden=true;pintarMejoras();$("pantMejoras").hidden=false;};
$("finOtra").onclick=()=>abrirIntro(nivelIdx);
$("finMenu").onclick=()=>{$("fin").hidden=true;pintarMenu();$("menu").hidden=false;};
/* teclas: 1-4 canillas, F freidora, H/J plancha, M maní, P picada */
addEventListener("keydown",e=>{if(!jugar())return;const k=e.key.toLowerCase();
  if("1234".includes(k)&&k.length===1){if(!e.repeat)apretarCanilla(canillas[+k-1]);}
  else if(k==="f")tocarFreidora();else if(k==="h")tocarPlancha(plancha[0]);else if(k==="j")tocarPlancha(plancha[1]);
  else if(k==="m")maniE.hit.dispatchEvent(new Event("pointerdown"));else if(k==="p")tocarPicada();else if(k===" "||k==="escape")$("pausa").click();});
addEventListener("keyup",e=>{if("1234".includes(e.key)&&e.key.length===1&&canillas[+e.key-1])soltarCanilla(canillas[+e.key-1]);});
$("pausa").onclick=()=>{if(!jugando)return;pausado=true;musicaPausa();$("pantPausa").hidden=false;};
$("pSeguir").onclick=()=>{pausado=false;musicaPlay();$("pantPausa").hidden=true;};
$("pMenu").onclick=()=>{pausado=false;jugando=false;musicaStop();$("pantPausa").hidden=true;pintarMenu();$("menu").hidden=false;};
document.addEventListener("visibilitychange",()=>{if(document.hidden){musicaPausa();if(jugando&&!pausado){pausado=true;$("pantPausa").hidden=false;}}});
addEventListener("pagehide",musicaStop);
/* la ayuda del nivel 1 se va sola después del primer cliente atendido */
setInterval(()=>{if(nivelIdx===0&&atendidos>=1&&pasoAyuda<3)ocultarAyuda(2);},500);
N=NIVELES[0];armarPuestos();pintarHud();pintarMenu();$("bancoMenu").textContent=banco;
</script>
