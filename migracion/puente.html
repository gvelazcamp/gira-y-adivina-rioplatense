<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// Quien ya trasladó su partida entra sin volver a ver el aviso de traslado.
// Pasamos por migrar.html para poder restaurarla si se borró el almacenamiento nuevo.
try {
  const enlace=localStorage.getItem("dominio_migracion_v1");
  if(enlace){
    
    location.replace("https://girayadivina.com/migrar.html#"+enlace);
  }
} catch (_) {}
</script>
<title>Trasladando Girá y Adiviná</title>
<style>html,body{background:#160B24}body{font:16px system-ui;color:#f6efe2;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;text-align:center}main{max-width:440px;display:grid;place-items:center;gap:12px}main img{width:112px;height:112px;border-radius:26px;box-shadow:0 18px 46px #00000088,0 0 28px #F5B30155}h1{font:900 1.05rem system-ui;text-transform:uppercase;margin:0}#estado{opacity:.7;font-size:.85rem;margin:0}.barra{position:fixed;left:50%;bottom:5%;transform:translateX(-50%);width:min(62vw,300px);height:8px;border-radius:99px;background:#160B2499;border:1px solid #F5B30155;overflow:hidden}.barra i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#F5B301,#FFE39B);animation:c 4s cubic-bezier(.2,.7,.3,1) forwards}@keyframes c{to{width:85%}}a{color:#37d6c0}button{font:inherit;border:0;border-radius:12px;padding:12px 20px;background:#f5b301;color:#1a1024}</style>
<main><img src="icono-192.png" alt=""><h1>Girá y Adiviná</h1><p id="estado">Estamos trasladando tu partida al nuevo dominio…</p><p id="alternativa" hidden><button id="reintentar">Reintentar</button><br><br><a href="juego-anterior.html">Seguir jugando aquí</a></p></main><div class="barra"><i></i></div>
<script>
/* Se publica como index.html SOLO en el sitio anterior, una vez que
   girayadivina.com esté alojado por separado. La clave nunca va a Supabase:
   viaja en el fragmento de la URL y la copia almacenada está cifrada. */
const DESTINO="https://girayadivina.com/";
const SUPA_URL="https://qfeubudlnoogwzozywph.supabase.co";
const SUPA_KEY="sb_publishable_NHKQdADMpHSaSDW9WAlRGA_QLLJkeR7";
const MARCA="dominio_migracion_v1";
const estado=document.getElementById("estado"),alternativa=document.getElementById("alternativa");
const base64url=bytes=>{let bin="";for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");};
function clavePermitida(k){return k.startsWith("gya_")||k.startsWith("larueda_")||k.startsWith("mj_")||k.startsWith("ps-")||["dispositivo_gya","regllave_priv","regllave_pub","pz_partida","sopa-best","rueda-best","rosco-best","ga_ultima_apertura"].includes(k);}
function leerPartida(){
  const datos={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&clavePermitida(k))datos[k]=localStorage.getItem(k);
  }
  return datos;
}
async function trasladar(){
  alternativa.hidden=true;
  estado.textContent="Estamos trasladando tu partida al nuevo dominio…";
  try{
    if(location.protocol!=="https:")throw Error("La dirección anterior todavía no usa HTTPS.");
    const anterior=localStorage.getItem(MARCA);
    if(anterior){location.replace(DESTINO+"migrar.html#"+anterior);return;}
    const datos=leerPartida();
    if(!Object.keys(datos).length){location.replace(DESTINO+"?sin_partida_anterior=1");return;}
    if(!crypto.subtle)throw Error("Este navegador no permite cifrar la partida.");
    const id=base64url(crypto.getRandomValues(new Uint8Array(18)));
    const clave=crypto.getRandomValues(new Uint8Array(32));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const aes=await crypto.subtle.importKey("raw",clave,"AES-GCM",false,["encrypt"]);
    const texto=new TextEncoder().encode(JSON.stringify({version:1,datos}));
    const cifrado=base64url(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,texto)));
    const fila={grupo:"migra",apodo:id,monedas_totales:0,ciudades_ganadas:0,mejor_racha:0,logros:0,
      estado_juego:{version:1,iv:base64url(iv),cifrado},actualizado_en:new Date().toISOString()};
    const res=await fetch(SUPA_URL+"/rest/v1/gya_ranking",{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(fila)});
    if(!res.ok)throw Error("No se pudo guardar la copia cifrada ("+res.status+").");
    const enlace=id+"."+base64url(clave);
    localStorage.setItem(MARCA,enlace);
    location.replace(DESTINO+"migrar.html#"+enlace);
  }catch(e){
    estado.textContent=(e&&e.message||"No se pudo trasladar la partida.")+" Tu partida sigue en este teléfono.";
    alternativa.hidden=false;
  }
}
document.getElementById("reintentar").onclick=trasladar;
trasladar();
</script>
</html>
