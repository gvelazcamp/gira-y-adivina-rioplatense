<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palabra Secreta</title>
<style>
:root{--bg:#160B24;--bar:#2a1646;--tile:#f6f0dc;--ink:#160B24;--g:#2fbf71;--y:#ffd23f;--x:#4a3a66;--mut:#b9a6d9;--sel:#e8337a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:'Arial Black',Impact,system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:440px;padding:12px;text-align:center}
h1{font-size:clamp(24px,7vw,32px);margin:2px 0 4px}
.sub{color:var(--mut);font:600 13px system-ui;margin:0 0 10px}
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(78vw,300px);margin:0 auto 12px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.row.no{animation:no .3s}
.t{aspect-ratio:1;border:2px solid var(--x);border-radius:8px;display:grid;place-items:center;font-size:clamp(20px,7vw,30px);text-transform:uppercase}
.t.f{border-color:var(--mut)}
.t.g,.t.y,.t.x{border-color:transparent}
.t.g{background:var(--g)}.t.y{background:var(--y);color:var(--ink)}.t.x{background:var(--x)}
.t.girar{animation:giro .5s ease-in-out}
@keyframes giro{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes no{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.kr{display:flex;gap:4px;justify-content:center;width:100%}
.k{flex:1;max-width:38px;height:46px;border:0;border-radius:6px;background:var(--tile);color:var(--ink);font:inherit;font-size:15px;padding:0;cursor:pointer}
.k.w{max-width:58px;font-size:12px}
.k.g{background:var(--g);color:#fff}.k.y{background:var(--y)}.k.x{background:var(--x);color:var(--mut)}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.help{background:none;border:1px solid var(--x);color:var(--mut);border-radius:999px;padding:4px 12px;font:600 13px system-ui;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,4,20,.9);display:flex;align-items:center;justify-content:center;padding:20px}
.ov.h{display:none}
.card{background:var(--tile);color:var(--ink);border-radius:16px;padding:22px;max-width:380px;max-height:92vh;overflow:auto}
.card h2{margin:0 0 8px;font-size:24px}
.card p,.card li{font:600 15px/1.4 system-ui;margin:0 0 10px;text-align:left}
.card ol{padding-left:20px;margin:0 0 10px}
.ex{display:flex;gap:4px;justify-content:center;margin:0 0 10px}
.ex span{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font-size:18px;background:var(--x);color:#fff}
.ex .y{background:var(--y);color:var(--ink)}.ex .g{background:var(--g)}
pre{font-size:20px;line-height:1.2;margin:0 0 12px;text-align:center}
.card button.b{font:inherit;background:var(--sel);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:16px;cursor:pointer;margin:2px}
.ov:not(.h) .card{animation:ruleta .6s cubic-bezier(.2,.8,.3,1)}
@keyframes ruleta{0%{transform:rotate(-270deg) scale(.2);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.t.girar,.row.no,.ov:not(.h) .card{animation:none}}
</style>
</head>
<body>
<main class="app">
  <h1>Palabra Secreta</h1>
  <p class="sub" id="sub">Palabra de hoy · 6 intentos</p>
  <div id="board"></div>
  <div id="kb"></div>
  <p><button class="help" id="hb">¿Cómo se juega?</button></p>
</main>
<div class="ov" id="ov"><div class="card" id="cd"></div></div>
<script>
const WORDS=["ASADO","TANGO","MURGA","PLAYA","ROCHA","SALTO","PUNTA","TORTA","DULCE","BOMBA","CARNE","FRITA","PIBES","BOCHA","BAILE","FERIA","CANTO"];
const $=s=>document.querySelector(s),day=Math.floor(Date.now()/86400000);
let secret,guesses=[],cur='',over=false,daily=true;
const board=$('#board');
for(let i=0;i<6;i++){const r=document.createElement('div');r.className='row';for(let j=0;j<5;j++){const t=document.createElement('div');t.className='t';r.appendChild(t)}board.appendChild(r)}
const kb=$('#kb');
["QWERTYUIOP","ASDFGHJKL","+ZXCVBNM-"].forEach(l=>{const r=document.createElement('div');r.className='kr';
 [...l].forEach(c=>{const b=document.createElement('button');b.className='k'+(c==='+'||c==='-'?' w':'');b.textContent=c==='+'?'ENVIAR':c==='-'?'⌫':c;b.dataset.k=c;r.appendChild(b)});kb.appendChild(r)});
function score(g){const r=Array(5).fill('x'),s=secret.split('');
 for(let i=0;i<5;i++)if(g[i]===s[i]){r[i]='g';s[i]=null}
 for(let i=0;i<5;i++)if(r[i]==='x'){const j=s.indexOf(g[i]);if(j>=0){r[i]='y';s[j]=null}}
 return r}
function render(flipRow){
 [...board.children].forEach((row,i)=>{const g=guesses[i],sc=g&&score(g);
  [...row.children].forEach((t,j)=>{
   t.className='t';t.textContent=g?g[j]:(i===guesses.length?(cur[j]||''):'');
   if(i===guesses.length&&cur[j])t.classList.add('f');
   if(g){const apply=()=>t.classList.add(sc[j]);
    if(i===flipRow){t.classList.add('girar');t.style.animationDelay=j*150+'ms';setTimeout(apply,j*150+250)}else apply()}})});
 const best={};guesses.forEach(g=>score(g).forEach((c,i)=>{const k=g[i],o=best[k];if(!o||(o==='x')||(o==='y'&&c==='g'))best[k]=c}));
 kb.querySelectorAll('.k').forEach(b=>{b.classList.remove('g','y','x');if(best[b.dataset.k])b.classList.add(best[b.dataset.k])});
}
function save(){if(daily)try{localStorage.setItem('ps-dia',JSON.stringify({day,guesses}))}catch(e){}}
function start(d){
 daily=d;secret=d?WORDS[day%WORDS.length]:WORDS[Math.random()*WORDS.length|0];guesses=[];cur='';over=false;
 $('#sub').textContent=d?'Palabra de hoy · 6 intentos':'Práctica · 6 intentos';
 if(d)try{const s=JSON.parse(localStorage.getItem('ps-dia'));if(s&&s.day===day)guesses=s.guesses}catch(e){}
 over=guesses.includes(secret)||guesses.length>=6;render();if(over)setTimeout(result,300);
}
function card(html){$('#cd').innerHTML=html;$('#ov').classList.remove('h')}
function help(){card(`<h2>Palabra Secreta</h2><p>La app eligió una palabra rioplatense de <b>5 letras</b> y no te la dice. Tenés <b>6 intentos</b> para adivinarla.</p><ol><li>Escribí cualquier palabra de 5 letras y tocá ENVIAR.</li><li>Cada letra se pone de un color:</li></ol><p>🟩 <b>Verde:</b> está en la palabra y en ese lugar.<br>🟨 <b>Amarillo:</b> está, pero en otro lugar.<br>⬛ <b>Gris:</b> no está.</p><p>Ejemplo, si la palabra secreta es <b>ASADO</b> y escribís <b>MATES</b>:</p><div class="ex"><span>M</span><span class="y">A</span><span>T</span><span>E</span><span class="y">S</span></div><p>Te dice que tiene A y S, pero en otros lugares, y que no tiene M, T ni E. Con eso probás otra.</p><p>Hay una palabra por día, igual para todos.</p><button class="b" id="cl">Jugar</button>`);$('#cl').onclick=()=>$('#ov').classList.add('h')}
function result(){
 const ok=guesses.includes(secret),d=new Date(),txt=`Palabra Secreta ${d.getDate()}/${d.getMonth()+1} ${ok?guesses.length:'X'}/6\n`+guesses.map(g=>score(g).map(c=>({g:'🟩',y:'🟨',x:'⬛'}[c])).join('')).join('\n');
 card(`<h2>${ok?'¡La sacaste!':'Se acabaron los intentos'}</h2><p>${ok?`Era <b>${secret}</b>. La adivinaste en ${guesses.length} de 6.`:`La palabra era <b>${secret}</b>.`}</p><pre>${txt.split('\n').slice(1).join('\n')}</pre><button class="b" id="cp">Copiar resultado</button><button class="b" id="pr">Jugar otra (práctica)</button>`);
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#cp').textContent='¡Copiado!'}catch(e){$('#cp').textContent='No se pudo copiar'}};
 $('#pr').onclick=()=>{$('#ov').classList.add('h');start(false)};
}
function press(k){
 if(over||!$('#ov').classList.contains('h'))return;
 if(k==='-'){cur=cur.slice(0,-1)}
 else if(k==='+'){
  if(cur.length<5){const r=board.children[guesses.length];r.classList.add('no');setTimeout(()=>r.classList.remove('no'),300);return}
  guesses.push(cur);cur='';const row=guesses.length-1;save();render(row);
  if(guesses[row]===secret||guesses.length>=6){over=true;setTimeout(result,1500)}
  return}
 else if(cur.length<5)cur+=k;
 render();
}
kb.addEventListener('click',e=>{const b=e.target.closest('.k');if(b)press(b.dataset.k)});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter')press('+');else if(e.key==='Backspace')press('-');
 else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase());
});
$('#hb').onclick=help;
start(true);
try{if(!localStorage.getItem('ps-visto')&&!over){localStorage.setItem('ps-visto','1');help()}}catch(e){help()}
</script>
</body>
</html>
