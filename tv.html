<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#160b24"><title>Entrar a Sala TV · Girá y Adiviná</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#160b24;color:#f6efe2;font:18px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:420px;width:100%}img{width:88px;border-radius:18px}h1{color:#f5b301}label{display:block;margin:20px 0 6px}input,button{width:100%;font:inherit;border-radius:12px;padding:15px;border:2px solid #755a90}input{background:#241239;color:white}button{background:#f5b301;color:#160b24;font-weight:700;margin-top:24px;border:0}a{color:#37d6c0}small{display:block;margin-top:24px;line-height:1.5}#error{color:#ffb9b9}input:focus,button:focus{outline:3px solid #37d6c0}
</style></head><body><main><img src="icono-192.png" alt="Girá y Adiviná"><h1>Jugá con la tele</h1><p>La tele muestra el tablero. Vos jugás y respondés desde este celular.</p>
<form id="join"><label for="name">Tu nombre</label><input id="name" maxlength="12" required autocomplete="nickname" placeholder="¿Cómo te llamás?">
<label for="code">Código que aparece en la tele</label><input id="code" minlength="4" maxlength="6" required autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Ej.: 0ABCDE"><button>Entrar a la sala</button><p id="error" role="alert"></p></form>
<small>Versión de prueba · 2 a 6 jugadores · Todos necesitan internet.<br>Mantené la pantalla de la tele abierta durante la partida.</small><p><a href="index.html?tvhost=1">Abrir pantalla de TV</a></p></main>
<script>
const query=new URLSearchParams(location.search);document.getElementById('code').value=query.get('codigo')||'';
document.getElementById('join').onsubmit=e=>{e.preventDefault();const code=document.getElementById('code').value.trim().toUpperCase(),name=document.getElementById('name').value.trim().replace(/[<>&"']/g,'');if(!/^(?:[0-2][A-Z2-9]{5}|[A-Z2-9]{4})$/.test(code)||!name){document.getElementById('error').textContent='Revisá el nombre y el código de la tele.';return;}const url=new URL('index.html',location.href);url.searchParams.set('tv',code);url.searchParams.set('tvname',name);location.href=url.href;};
</script></body></html>
